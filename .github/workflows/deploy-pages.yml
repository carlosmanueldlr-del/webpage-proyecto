name: Deploy to GitHub Pages (Bold Editorial preview)

on:
  push:
    branches:
      - claude/joana-bold-editorial
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-bold-editorial
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Deploy to gh-pages branch (bold-editorial/ subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: bold-editorial
          keep_files: true
